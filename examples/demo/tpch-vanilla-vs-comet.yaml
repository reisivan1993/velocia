# Local demo: vanilla Apache Spark 3.5.9 vs Apache DataFusion Comet on TPC-H-derived data, SF1.
# Sized for Docker Desktop with 8 GB of memory: one container, 4 cores, 3 GB.
name: demo-tpch-vanilla-vs-comet
workload: {kind: sql, suite: tpch, units: all, scale_factor: 1, format: parquet-zstd}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time, cost_usd]
repetitions: 5
modes: [cold]
timeout_per_unit: 10m
