# Strings: multi-byte UTF-8, LIKE and regexp on longer and longer strings.
name: synth-strings
workload:
  kind: sql
  suite: synth
  units: [strings]
  synth: {rows: 2000000}
  sweep: {string_length: [8, 64, 512]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
