# Window functions: a growing frame over partitions of ~50 rows (rows / keys).
name: synth-windows
workload:
  kind: sql
  suite: synth
  units: [window]
  synth: {rows: 5000000, keys: 100000}
  sweep: {window_frame: [1, 10, 100, 1000]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
