# Scan + filter selectivity: 0.1% to 90% of rows kept (one dataset; only the query changes).
name: synth-selectivity
workload:
  kind: sql
  suite: synth
  units: [scan_filter]
  synth: {rows: 10000000}
  sweep: {selectivity: [0.001, 0.01, 0.1, 0.5, 0.9]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
