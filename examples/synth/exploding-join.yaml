# Exploding join: a many-to-many self-join; fan-out per key = rows / keys (100 .. 1).
name: synth-exploding-join
workload:
  kind: sql
  suite: synth
  units: [exploding_join]
  synth: {rows: 1000000}
  sweep: {keys: [10000, 100000, 1000000]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time, task_cpu_time, spill_bytes]
repetitions: 5
modes: [cold]
