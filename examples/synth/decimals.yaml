# Decimal precision: decimal(38, 10) sums and averages at growing row counts.
name: synth-decimals
workload:
  kind: sql
  suite: synth
  units: [decimals]
  sweep: {rows: [1000000, 5000000, 20000000]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
