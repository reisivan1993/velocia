# Nested types: explode an array that grows.
name: synth-nested
workload:
  kind: sql
  suite: synth
  units: [nested]
  synth: {rows: 1000000}
  sweep: {nest_fanout: [1, 10, 100]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
