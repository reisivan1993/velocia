# UDF fallback: the same aggregation with and without a Python UDF in the middle.
# Compare the `udf` and `nulls` units (same grouping); accelerators fall back around the UDF.
name: synth-udf-fallback
workload:
  kind: sql
  suite: synth
  units: [nulls, udf]
  synth: {rows: 5000000}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time, task_cpu_time]
repetitions: 5
modes: [cold]
