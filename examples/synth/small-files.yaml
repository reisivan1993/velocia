# Small files: the same data in more and more files.
name: synth-small-files
workload:
  kind: sql
  suite: synth
  units: [scan_filter, aggregate]
  synth: {rows: 5000000}
  sweep: {files: [10, 100, 1000, 10000]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time, task_cpu_time]
repetitions: 5
modes: [cold]
