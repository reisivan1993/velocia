# Null-heavy columns.
name: synth-nulls
workload:
  kind: sql
  suite: synth
  units: [nulls]
  synth: {rows: 5000000}
  sweep: {null_fraction: [0, 0.25, 0.5, 0.9]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time]
repetitions: 5
modes: [cold]
