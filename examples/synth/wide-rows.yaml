# Wide rows: project 5 columns out of more and more.
name: synth-wide-rows
workload:
  kind: sql
  suite: synth
  units: [wide_projection]
  synth: {rows: 1000000}
  sweep: {payload_columns: [10, 100, 500, 2000]}
engines: [spark-vanilla, spark-comet]
reference_engine: spark-vanilla
cluster: {runner: local, executors: 1, executor_cores: 4, executor_memory: 3g}
measures: [wall_time, throughput_bytes]
repetitions: 5
modes: [cold]
